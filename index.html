<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Билеты ПДД</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{--bg:#efece4;--panel:#fff;--ink:#1b1f23;--mute:#656d73;--line:#d6d1c3;--amber:#f0a800;--blue:#1d5fc4;--ok:#1e8a4c;--bad:#c93b2f;--okbg:#dff1e6;--badbg:#fbe1de;--plate:#0b6b45}
@media (prefers-color-scheme:dark){:root{--bg:#14161a;--panel:#1f2328;--ink:#f1efe8;--mute:#9aa2a9;--line:#343a42;--amber:#ffc41f;--blue:#5b9bff;--ok:#4cc57c;--bad:#f2766b;--okbg:#173a2c;--badbg:#42201d;--plate:#0e7d52}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding-top:env(safe-area-inset-top,0)}
main{max-width:560px;margin:0 auto;padding:12px 16px 110px 32px;position:relative;min-height:100vh}
main::before{content:"";position:absolute;left:12px;top:0;bottom:0;width:5px;background:repeating-linear-gradient(var(--amber) 0 22px,transparent 22px 40px);opacity:.6;border-radius:3px}
h1{background:var(--plate);color:#fff;border:3px solid #fff;box-shadow:0 0 0 3px var(--plate),0 8px 20px rgba(0,0,0,.25);border-radius:10px;padding:12px 16px;font-size:24px;line-height:1.15;margin:10px 4px 18px}
h1 small{display:block;font-size:13px;font-weight:500;opacity:.9;margin-top:4px}
.lbl{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--mute);margin:14px 0 8px}
.sub{color:var(--mute);margin:0 0 14px}
.m{display:block;position:relative;width:100%;text-align:left;background:var(--panel);border:2px solid var(--line);border-bottom-width:5px;border-radius:14px;padding:13px 44px 13px 14px;margin-bottom:10px;color:inherit;font:inherit;cursor:pointer;transition:transform .08s}
.m::after{content:"›";position:absolute;right:14px;top:50%;transform:translateY(-54%);font-size:30px;font-weight:700;color:var(--amber)}
.m:active{transform:translateY(3px)}
.m.ic{padding-left:76px;min-height:70px}
.m.ic svg{position:absolute;left:12px;top:50%;margin-top:-26px;width:52px;height:52px}
.m.hot{border-color:var(--amber)}
.m b{display:block;font-size:17px}.m span{font-size:13px;color:var(--mute)}
.o{display:flex;gap:12px;align-items:center;width:100%;text-align:left;background:var(--panel);border:2px solid var(--line);border-bottom-width:4px;border-radius:14px;padding:11px 12px;margin-bottom:9px;color:inherit;font:inherit;cursor:pointer}
.o i{flex:none;width:30px;height:30px;border-radius:50%;background:var(--line);display:grid;place-items:center;font-style:normal;font-weight:800;font-size:14px}
.o.ok{border-color:var(--ok);background:var(--okbg)}.o.ok i{background:var(--ok);color:#fff}
.o.bad{border-color:var(--bad);background:var(--badbg)}.o.bad i{background:var(--bad);color:#fff}
.o:disabled{cursor:default}
.bar{height:12px;background:var(--panel);border:2px solid var(--line);border-radius:8px;overflow:hidden;margin:8px 0 14px}
.bar i{display:block;height:100%;background:repeating-linear-gradient(90deg,var(--amber) 0 12px,transparent 12px 18px);transition:width .25s}
.top{display:flex;justify-content:space-between;align-items:center;color:var(--mute);font-size:14px;margin:4px 0 6px}
.back{background:var(--panel);border:2px solid var(--line);border-radius:10px;padding:6px 12px;font:600 14px system-ui,sans-serif;color:var(--ink);cursor:pointer}
.tp{display:inline-block;background:var(--panel);border:1px solid var(--line);border-radius:99px;padding:2px 10px;font-size:12px;color:var(--mute)}
.q{font-size:20px;font-weight:700;margin:10px 0 14px;line-height:1.3}
.ex{margin:12px 0;padding:12px 14px;border-left:5px solid var(--amber);background:var(--panel);border-radius:0 12px 12px 0;font-size:15px}
.btn{display:block;width:100%;padding:14px;border:0;border-bottom:4px solid #b97f00;border-radius:14px;background:var(--amber);color:#1b1f23;font:800 16px system-ui,sans-serif;cursor:pointer;margin-top:12px}
.btn:active{transform:translateY(2px)}
.btn.alt{background:transparent;color:var(--ink);border:2px solid var(--line);border-bottom-width:4px}
.score{font-size:64px;font-weight:800;letter-spacing:-.03em;margin:6px 0}
.err{padding:10px 0;border-top:1px solid var(--line);font-size:15px}.err small{color:var(--mute);display:block}
.stat{display:flex;gap:8px;margin-bottom:6px}.stat div{flex:1;background:var(--panel);border:2px solid var(--line);border-bottom-width:4px;border-radius:12px;padding:8px;text-align:center}.stat b{display:block;font-size:22px}.stat span{font-size:12px;color:var(--mute)}
.im{text-align:center;margin:0 0 12px}.im svg{height:110px;width:auto;max-width:100%}
.sg{display:flex;gap:12px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}.sg>div:first-child{flex:0 0 auto}.sg svg{width:84px;height:auto;display:block}.sg svg[viewBox^="0 0 200"]{width:116px}.sg span{font-size:14px;color:var(--mute)}
h3{margin:18px 0 4px;font-size:13px;text-transform:uppercase;letter-spacing:.05em;color:var(--mute)}
.row{display:flex;gap:10px;flex-wrap:wrap;margin:6px 0 12px}.row svg{height:72px;width:auto}
nav{position:fixed;left:0;right:0;bottom:0;display:none;justify-content:center;gap:4px;background:var(--panel);border-top:2px solid var(--line);padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px));z-index:9}
nav button{flex:1;max-width:84px;background:none;border:0;color:var(--mute);font:700 10px system-ui,sans-serif;display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 2px;border-radius:10px;cursor:pointer}
nav svg{width:24px;height:24px;fill:currentColor}
nav .on{background:var(--amber);color:#1b1f23}
.hint{font-size:13px;color:var(--mute);margin:0 0 8px;font-weight:600}
.o.sel{border-color:var(--blue)}.o.sel i{background:var(--blue);color:#fff}
.hardp{background:var(--bad);color:#fff;border-color:var(--bad)}
.num{width:100%;padding:14px;font:700 20px system-ui,sans-serif;background:var(--panel);color:var(--ink);border:2px solid var(--line);border-radius:14px}
.btn:disabled{opacity:.45;cursor:default}
.row svg[viewBox^="0 0 200"]{height:auto;width:100%;max-width:300px}
.im img{max-width:100%;max-height:200px;border-radius:12px}.row img{height:96px;border-radius:10px}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}
.chip{background:var(--panel);border:2px solid var(--line);border-radius:99px;padding:6px 12px;font:600 13px system-ui,sans-serif;color:var(--ink);cursor:pointer}
.bub{max-width:94%;padding:10px 12px;border-radius:14px;margin:8px 0;font-size:15px;line-height:1.4}
.bub.bot{background:var(--panel);border:2px solid var(--line);border-bottom-left-radius:4px}
.bub.me{background:var(--amber);color:#1b1f23;margin-left:auto;border-bottom-right-radius:4px;font-weight:600}
.ab{display:block;width:100%;text-align:left;margin-top:8px;padding:9px 12px;border-radius:10px;border:2px solid var(--amber);background:transparent;color:var(--ink);font:700 13px system-ui,sans-serif;cursor:pointer}
.cb{position:sticky;bottom:0;display:flex;gap:8px;background:var(--bg);padding:10px 0 calc(10px + env(safe-area-inset-bottom,0px));margin-top:10px}
.cb input{flex:1;min-width:0;padding:12px;border:2px solid var(--line);border-radius:12px;background:var(--panel);color:var(--ink);font:16px system-ui,sans-serif}
.send{padding:0 14px;border:0;border-bottom:4px solid #b97f00;border-radius:12px;background:var(--amber);color:#1b1f23;font:800 14px system-ui,sans-serif;cursor:pointer}
.fab{position:fixed;right:12px;bottom:calc(76px + env(safe-area-inset-bottom,0px));z-index:10;display:none;align-items:center;gap:6px;padding:10px 14px;border:0;border-bottom:4px solid #b97f00;border-radius:99px;background:var(--amber);color:#1b1f23;font:800 13px system-ui,sans-serif;box-shadow:0 6px 16px rgba(0,0,0,.3);cursor:pointer}
.fab svg{width:20px;height:20px;fill:currentColor}
.chip.on{background:var(--amber);color:#1b1f23;border-color:var(--amber)}
button:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
</style>
</head>
<body>
<main id="app"></main>
<nav id="nav"></nav>
<button id="fab" class="fab"><svg viewBox="0 0 24 24"><path d="M4 4h16a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2H9l-5 4v-4H4a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2z"/></svg>Помощник</button>
<script>
/* БАЗА ВОПРОСОВ. Формат: [тема, "вопрос", ["ВЕРНЫЙ ответ первым", "неверный", ...], "пояснение"].
   Варианты перемешиваются при показе. Новые вопросы добавляйте только в конец списка. */
const TP=["Общие положения","Скорость","Остановка и стоянка","Обгон и манёвры","Перекрёстки","Сигналы и свет","Знаки и разметка","Пешеходы и переезды","Автопоезд и прицепы","Первая помощь"];
const Q=[
[0,"С какого возраста можно управлять легковым автомобилем категории B?",["С 18 лет","С 16 лет","С 17 лет","С 21 года"],"Для категории B минимальный возраст — 18 лет."],

[0,"Какие документы водитель обязан иметь при себе?",["Водительское удостоверение, регистрационные документы на ТС и полис ОСАГО","Только водительское удостоверение","Паспорт и водительское удостоверение","Только свидетельство о регистрации"],"Это права, документы на транспортное средство и страховой полис ОСАГО."],
[0,"На каком расстоянии вне населённого пункта выставляется знак аварийной остановки?",["Не менее 30 м","Не менее 15 м","Не менее 10 м","Не менее 50 м"],"В населённых пунктах — не менее 15 м, вне них — не менее 30 м."],
[1,"Какая скорость разрешена в жилых зонах и во дворах?",["Не более 20 км/ч","Не более 10 км/ч","Не более 30 км/ч","Не более 40 км/ч"],"В жилых зонах и на дворовых территориях — не более 20 км/ч."],
[1,"Какая максимальная скорость разрешена легковому автомобилю вне населённых пунктов на обычной дороге?",["90 км/ч","70 км/ч","110 км/ч","130 км/ч"],"Вне населённых пунктов легковым разрешено до 90 км/ч, если знаки не устанавливают иное."],
[1,"Какая максимальная скорость разрешена легковому автомобилю на автомагистрали?",["110 км/ч","90 км/ч","100 км/ч","130 км/ч"],"На автомагистралях — до 110 км/ч, если знаки не ограничивают скорость."],
[1,"Какая максимальная скорость разрешена в населённом пункте, если знаки не устанавливают иное?",["60 км/ч","50 км/ч","70 км/ч","80 км/ч"],"В населённых пунктах разрешено движение до 60 км/ч."],
[2,"На каком расстоянии до ближайшего рельса запрещена остановка у железнодорожного переезда?",["Ближе 5 м","Ближе 10 м","Ближе 15 м","Ближе 20 м"],"Остановка и стоянка запрещены ближе 5 метров до ближайшего рельса."],
[2,"Разрешена ли остановка на пешеходном переходе?",["Запрещена","Разрешена на несколько секунд","Разрешена с аварийной сигнализацией","Разрешена, если нет пешеходов"],"Остановка на пешеходных переходах и ближе 5 м перед ними запрещена."],
[2,"Ближе какого расстояния до пересекаемой проезжей части запрещена остановка у перекрёстка?",["Ближе 5 м","Ближе 10 м","Ближе 15 м","Ближе 3 м"],"На перекрёстках и ближе 5 м от пересекаемой проезжей части останавливаться нельзя."],
[3,"Где запрещён обгон?",["На пешеходных переходах","На прямом участке при хорошей видимости","На дороге с широкой обочиной","На многополосной дороге"],"Обгон запрещён на пешеходных переходах, перекрёстках и в других опасных местах."],
[3,"Разрешён ли обгон в конце подъёма?",["Запрещён","Разрешён при хорошей видимости","Разрешён, если нет встречных","Разрешён на низкой скорости"],"Обгон запрещён в конце подъёма, на опасных поворотах и участках с ограниченной видимостью."],
[3,"Где запрещён разворот?",["На пешеходных переходах","На перекрёстках","На дорогах вне города","На дорогах с двусторонним движением"],"Разворот запрещён на пешеходных переходах, в тоннелях, на мостах и ж/д переездах."],
[3,"При одновременном перестроении попутных автомобилей кто уступает дорогу?",["Водитель слева","Водитель справа","Тот, кто едет быстрее","Тот, кто позже включил сигнал"],"Уступить должен водитель, находящийся слева, — преимущество у того, кто справа."],
[4,"Как проехать нерегулируемый перекрёсток равнозначных дорог?",["Уступить дорогу транспорту справа","Уступить транспорту слева","Ехать первым, если быстрее","Уступить тому, кто едет прямо"],"Действует правило «помеха справа»."],
[4,"Красный сигнал светофора, включена дополнительная секция с зелёной стрелкой направо. Что делать?",["Повернуть направо, уступив пешеходам и транспорту других направлений","Стоять до зелёного","Ехать, не уступая никому","Ехать только прямо"],"Стрелка разрешает движение, но уступить дорогу остальным участникам нужно."],
[4,"Что означает поднятая вверх рука регулировщика?",["Движение запрещено всем","Движение разрешено прямо","Разрешён поворот налево","Нужно снизить скорость"],"Рука вверх запрещает движение всем транспортным средствам и пешеходам."],

[5,"Что означает мигающий зелёный сигнал светофора?",["Движение разрешено, скоро включится запрещающий сигнал","Движение запрещено","Нужно остановиться","Можно ехать только прямо"],"Мигающий зелёный разрешает движение и предупреждает о смене сигнала."],
[5,"Когда при движении обязательно включать ближний свет или ДХО?",["В любое время суток","Только в темноте","Только в тоннеле","Только в дождь"],"Ближний свет или дневные ходовые огни включают всегда при движении."],
[5,"Когда в населённом пункте разрешён звуковой сигнал?",["Только для предотвращения ДТП","Чтобы привлечь внимание пешехода","Всегда","При обгоне"],"В населённых пунктах сигнал подают только для предотвращения ДТП."],
[5,"В каком случае нужно включить аварийную сигнализацию?",["При вынужденной остановке в запрещённом месте","Чтобы обозначить стоянку у магазина","Чтобы поблагодарить водителя","При начале обгона"],"Аварийку включают при ДТП и вынужденной остановке там, где остановка запрещена."],
[6,"Что означает сплошная линия разметки 1.1?",["Разделяет встречные потоки; пересекать запрещено","Обозначает край проезжей части","Разрешает обгон","Обозначает место стоянки"],"Линия 1.1 разделяет транспортные потоки противоположных направлений."],

[6,"Как поступить перед знаком «Движение без остановки запрещено» (STOP)?",["Остановиться перед стоп-линией или пересекаемой проезжей частью","Снизить скорость и проехать, если нет помех","Остановиться, только если есть пешеходы","Проехать, подав звуковой сигнал"],"Остановка обязательна всегда, даже если помех нет."],
[6,"Чем знак «Остановка запрещена» отличается от «Стоянка запрещена»?",["Остановка — две перекрещенные линии, стоянка — одна косая","Цветом фона","Формой знака","Ничем"],"У знака 3.27 две перекрещенные линии, у 3.28 — одна косая."],
[6,"Что означает знак «Главная дорога» (белый ромб в жёлтой окантовке)?",["Преимущество на перекрёстках","Конец населённого пункта","Одностороннее движение","Уступить дорогу"],"Знак 2.1 даёт преимущество при проезде перекрёстков."],
[7,"Что означает красный мигающий сигнал на железнодорожном переезде?",["Движение запрещено","Движение разрешено","Можно проехать после остановки","Нужно ускориться"],"Красный мигающий сигнал запрещает движение через переезд."],
[7,"Пешеход вступил на нерегулируемый переход. Ваши действия?",["Уступить дорогу, при необходимости остановиться","Проехать, посигналив","Объехать сзади","Прибавить скорость"],"Водитель обязан уступить дорогу пешеходам, переходящим проезжую часть."],
[7,"Где остановиться перед переездом при закрытом шлагбауме, если нет стоп-линии и знака 1.12?",["Не ближе 5 м до шлагбаума","Вплотную к шлагбауму","Не ближе 1 м до шлагбаума","Не ближе 15 м до шлагбаума"],"При отсутствии стоп-линии и знака — не ближе 5 м до шлагбаума."],
[6,"Что требует этот знак?",["Уступить дорогу транспорту на пересекаемой дороге","Обязательно остановиться","Двигаться только прямо","Запрещает проезд"],"Знак 2.4 «Уступите дорогу» обязывает пропустить транспорт на пересекаемой дороге.","yield"],
[6,"Что означает этот знак?",["Въезд запрещён","Движение прямо запрещено","Стоянка запрещена","Конец главной дороги"],"Знак 3.1 «Въезд запрещён» запрещает въезд в данном направлении.","noentry"],
[6,"Что запрещает этот знак?",["Движение со скоростью более 40 км/ч","Движение со скоростью менее 40 км/ч","Движение на расстоянии 40 м","Остановку более чем на 40 секунд"],"Знак 3.24 ограничивает максимальную скорость.","sp40"],

const TH=[
["Обязанности водителя","Документы, запреты, ремни, телефон",["С собой всегда: водительское удостоверение, регистрационные документы на автомобиль и полис ОСАГО.","Запрещено садиться за руль в состоянии опьянения, под действием наркотиков и лекарств, снижающих реакцию, а также в болезненном или утомлённом состоянии.","Водитель и пассажиры обязаны быть пристёгнуты ремнями безопасности.","Пользоваться телефоном за рулём можно только с устройством, позволяющим говорить без помощи рук.","Требования регулировщика и сотрудников полиции нужно выполнять беспрекословно, по их сигналу остановитесь."],0],
["Перевозка людей и грузов","Дети в машине, габариты груза",["Детей до 7 лет возят только в детском удерживающем устройстве, подходящем по весу и росту.","Детей 7–11 лет на заднем сиденье пристёгивают ремнём или возят в удерживающем устройстве, на переднем — только в нём. Младше 12 лет на переднем сиденье — только в удерживающем устройстве.","Груз не должен выступать за габариты автомобиля более чем на 1 м спереди и сзади и более чем на 0,4 м сбоку, закрывать обзор и мешать управлению."],0],
["ДТП и первая помощь","Что делать на месте аварии",["Остановитесь, включите аварийную сигнализацию и выставьте знак аварийной остановки: не менее 15 м в населённом пункте и не менее 30 м вне его.","Если есть пострадавшие, вызовите скорую и полицию по номеру 112 и окажите первую помощь.","Не перемещайте пострадавшего без необходимости: возможна травма позвоночника. Исключение — угроза пожара или взрыва.","Сильное кровотечение: прижмите рану чистой тканью, наложите давящую повязку, при артериальном кровотечении — жгут выше раны, запишите время наложения.","Если пострадавший не дышит: 30 надавливаний на грудину и 2 вдоха, до приезда врачей.","Это краткая памятка и она не заменяет курсов первой помощи."],0],
["Скорость и дистанция","Ограничения и безопасный интервал",["Если нет знаков: в населённых пунктах — 60 км/ч, во дворах и жилых зонах — 20 км/ч, вне населённых пунктов — 90 км/ч, на автомагистралях — 110 км/ч.","Скорость должна учитывать погоду, видимость и состояние дороги и позволять остановиться при опасности.","Тормозной путь растёт пропорционально квадрату скорости: при удвоении скорости он вырастает примерно в четыре раза.","Практическое правило двух секунд: между вами и машиной впереди должно проходить не меньше 2 секунд. В дождь и на скользкой дороге интервал увеличивают."],1],
["Остановка и стоянка","Где можно и нельзя останавливаться",["Остановка — преднамеренное прекращение движения до 5 минут (или на любое время для посадки, высадки, погрузки). Стоянка — дольше 5 минут.","Остановка запрещена на пешеходных переходах и ближе 5 м перед ними, на перекрёстках и ближе 5 м от пересекаемой проезжей части, ближе 5 м до ж/д рельса и в тоннелях.","Ближе 15 м от остановки маршрутного транспорта остановка запрещена, кроме посадки и высадки.","Стоянка на тротуаре допустима только там, где это прямо разрешено знаками."],2,["nostop","nopark","park"]],
["Обгон и манёвры","Обгон, разворот, задний ход",["Перед обгоном убедитесь, что полоса свободна, водитель впереди не включил левый поворот, а сзади никто не начал обгон.","Включите левый указатель поворота, обгоните и вернитесь на свою полосу, не создавая помех обогнанному. Обгоняемый не должен увеличивать скорость.","Обгон запрещён на пешеходных переходах, ж/д переездах и ближе 100 м перед ними, в конце подъёма, на опасных поворотах, участках с плохой видимостью и в тоннелях.","Перед поворотом налево займите крайнее левое положение на своей проезжей части.","Разворот запрещён на пешеходных переходах, в тоннелях, на мостах, ж/д переездах и там, где видимость меньше 100 м. Задним ходом нельзя двигаться на перекрёстках, в тоннелях, на мостах и переездах."],3,["nopass"]],
["Перекрёстки","Приоритет и очерёдность проезда",["Нерегулируемый перекрёсток равнозначных дорог: уступайте транспорту, приближающемуся справа.","Главная дорога обозначается знаками, например 2.1. С второстепенной дороги (знаки 2.4 или 2.5) уступайте тем, кто едет по главной.","При повороте налево и развороте уступайте встречному транспорту, едущему прямо или направо, и пешеходам.","На кольце, если на въезде стоит знак «Уступите дорогу», преимущество у тех, кто уже движется по кольцу."],4,["main","endmain","yield","stop"]],
["Светофор и регулировщик","Сигналы и жесты",["Зелёный разрешает движение. Мигающий зелёный разрешает движение и предупреждает о смене сигнала.","Жёлтый запрещает движение, кроме случая, когда нельзя остановиться без экстренного торможения. Мигающий жёлтый означает нерегулируемый перекрёсток: ориентируйтесь на знаки.","Красный запрещает движение. Зелёная стрелка в дополнительной секции разрешает ехать в её направлении, но нужно уступить другим участникам.","Рука регулировщика поднята вверх: движение запрещено всем. Руки в стороны или опущены: с боков можно прямо и направо, спереди и сзади нельзя.","Если сигналы регулировщика и светофора противоречат, подчиняйтесь регулировщику."],4],
["Световые приборы и сигналы","Фары, аварийка, звуковой сигнал",["При движении в любое время суток включайте ближний свет или ДХО; в темноте и при плохой видимости — ближний или дальний.","Дальний свет переключайте на ближний при встречном разъезде и если ослепляете других водителей.","Противотуманные фары включают при тумане, снегопаде, дожде или в темноте на неосвещённой дороге.","Аварийная сигнализация нужна при ДТП и вынужденной остановке в запрещённом месте.","Звуковой сигнал в населённых пунктах разрешён только для предотвращения ДТП. Указатель поворота включайте заблаговременно."],5],
["Дорожные знаки","Группы знаков и правила их действия",["Предупреждающие — треугольник с красной каймой. Приоритета — определяют очерёдность проезда. Запрещающие — красный круг. Предписывающие — синий круг. Информационные и сервиса — синие прямоугольники и квадраты. Таблички уточняют действие знаков.","Знак действует от места установки до ближайшего перекрёстка, если табличкой не указано иное.","Если знаки и разметка противоречат друг другу, подчиняйтесь знакам. Временные знаки на жёлтом фоне важнее постоянных."],6,["yield","noentry","sp40","pedx"]],
["Дорожная разметка","Линии и их значение",["Постоянная разметка — белая, временная — оранжевая.","1.1 — сплошная линия, разделяет встречные потоки, пересекать нельзя. 1.3 — двойная сплошная на дорогах с четырьмя и более полосами. 1.5 — прерывистая, разделяет встречные потоки на дорогах с двумя-тремя полосами.","1.2.1 — край проезжей части. 1.14.1 («зебра») — нерегулируемый пешеходный переход.","Линия 1.6 предупреждает о приближении к сплошной линии."],6,["line","dash","dbl","edge","zebra"]],
["Пешеходы и ж/д переезды","Переходы и поезда",["На нерегулируемом переходе уступайте пешеходам, вступившим на проезжую часть. Не объезжайте машину, остановившуюся перед переходом.","Слепым пешеходам с белой тростью уступайте дорогу при любых условиях.","У переезда остановитесь перед стоп-линией или знаком 1.12, а при их отсутствии — не ближе 5 м до шлагбаума или не ближе 10 м до ближайшего рельса.","Въезд на переезд запрещён при красном мигающем сигнале, закрытом или закрывающемся шлагбауме, приближении поезда и при заторе за переездом.","Обгон на переезде и ближе 100 м перед ним запрещён."],7,["pedx","zebra"]],
["Что такое автопоезд","Состав, прицеп, категории прав",["Автопоезд — механическое транспортное средство (тягач), сцепленное с прицепом или полуприцепом. У прицепа нет двигателя, а полуприцеп частью веса опирается на тягач.","Состав: тягач, сцепное устройство, прицеп или полуприцеп, а также электрические и тормозные соединения.","Категория B даёт право ездить с прицепом разрешённой массой до 750 кг, а также с более тяжёлым прицепом, если разрешённая масса всего состава не больше 3500 кг. Если состав тяжелее — нужна категория BE.","Для грузовиков с прицепом нужны категории C и CE (CE — грузовик с тяжёлым прицепом)."],8,["truck","notrailer"]],
["Скорость и торможение","Почему автопоезд едет медленнее",["Грузовым автомобилям с разрешённой массой более 3,5 т вне населённых пунктов разрешено до 70 км/ч на обычных дорогах и до 90 км/ч на автомагистралях.","Для легковых автомобилей, буксирующих прицеп, ПДД тоже устанавливают сниженный предел: до 70 км/ч на обычных дорогах. Сверьтесь с актуальным текстом п. 10.3.","Тормозной путь автопоезда длиннее, чем у одиночного автомобиля: больше масса, а при торможении прицеп давит на тягач. Увеличивайте дистанцию.","На скользкой дороге резкое торможение или поворот может привести к «складыванию» автопоезда. Снижайте скорость заранее, тормозите плавно, избегайте резких манёвров."],8],
["Повороты, обгон, задний ход","Как ведёт себя прицеп",["Колёса прицепа идут по меньшему радиусу, чем колёса тягача. Поворачивайте шире и начинайте манёвр позже, иначе прицеп заденет бордюр, столб или соседнюю машину.","Перед обгоном автопоезда оцените его длину: на обгон нужно больше места и времени, убедитесь, что свободной полосы хватит.","Если обгоняют вас, не увеличивайте скорость и по возможности прижмитесь ближе к правому краю.","Задний ход с прицепом: держите руль за нижнюю часть и сдвигайте руку в ту сторону, куда должен повернуть прицеп. Двигайтесь медленно, лучше с помощником.","Развороты и повороты на узких улицах планируйте заранее с учётом длины состава."],8],
["Сцепка и подготовка","Что проверить перед выездом",["Сцепное устройство должно быть исправным и надёжно зафиксированным. Движение с неисправной сцепкой запрещено.","Прицеп соединяют с автомобилем страховочным тросом (цепью) на случай разрыва сцепки.","Проверьте габаритные огни, стоп-сигналы и указатели поворота прицепа, а также электроразъём.","Если у прицепа нет тормозов, его масса не должна превышать половины массы буксирующего автомобиля.","Груз закрепите и распределите равномерно, не превышайте разрешённую массу прицепа и тягача.","Следите за зеркалами: при необходимости установите дополнительные, чтобы видеть всю длину состава."],8,["warn"]],
["Знаки для автопоезда","Запреты по движению с прицепом",["Знак 3.7 «Движение с прицепом запрещено» запрещает движение грузовых автомобилей и тракторов с прицепами, а также механических ТС, буксирующих механические ТС.","Знак 3.4 «Движение грузовых автомобилей запрещено» относится к грузовикам с разрешённой массой более 3,5 т, если на знаке не указана другая масса.","Знак 3.2 «Движение запрещено» закрывает проезд всем транспортным средствам.","Знаки ограничения скорости действуют на всех, а для автопоезда ещё и действуют свои, более низкие пределы скорости.","Таблички под знаками уточняют зону и условия действия."],8,["notrailer","notruck","noveh"]],
["Буксировка","Гибкая и жёсткая сцепка",["Скорость при буксировке механического транспортного средства — не более 50 км/ч.","Гибкая сцепка: расстояние между автомобилями 4–6 м, трос должен быть хорошо виден (флажки, щитки). Жёсткая сцепка: расстояние не более 4 м.","На буксируемом механическом ТС включают аварийную сигнализацию, а при её неисправности ставят знак аварийной остановки на задней части.","На гибкой сцепке нельзя буксировать в гололёд и ТС с неисправными тормозами или рулевым управлением. На жёсткой сцепке нельзя буксировать ТС с неисправным рулевым управлением.","В буксируемом ТС должен быть водитель, который управляет рулём и тормозом.","Перевозка людей в кузове буксируемого грузового автомобиля и в прицепе запрещена."],8],
["Алгоритм проезда перекрёстка","Пять вопросов перед въездом",["1. Перекрёсток регулируемый? Подчиняйтесь регулировщику, а при его отсутствии светофору. Они главнее знаков приоритета.","2. Светофор не работает или мигает жёлтым? Перекрёсток нерегулируемый: смотрите знаки приоритета.","3. Есть знаки «Главная дорога» или «Уступите дорогу»? Тогда очерёдность проезда определяют они.","4. Знаков нет и дороги равнозначны? Уступите транспорту справа, а трамваю — независимо от направления.","5. Поворачиваете налево или разворачиваетесь? Уступите встречным, едущим прямо или направо.","Не выезжайте на перекрёсток, если за ним затор."],4,["rule"]],
["Первая помощь: с чего начать","Порядок действий на месте ДТП",["Остановитесь, включите аварийную сигнализацию, выставьте знак аварийной остановки. Убедитесь, что вам и пострадавшему ничто не угрожает.","Вызовите скорую и полицию по номеру 112 (скорую можно вызвать и по 103). Назовите адрес или ориентиры, число пострадавших и их состояние.","Определите, есть ли у пострадавшего сознание и дыхание: от этого зависит дальнейшая помощь.","Оказывайте только ту помощь, которой владеете, и не оставляйте пострадавшего одного до приезда медиков.","Первая помощь не заменяет медицинской: даже при хорошем самочувствии пострадавшего нужно показать врачу."],9,["steps","cross"]],
["Сердечно-лёгочная реанимация","Если человек без сознания и не дышит",["Признаки: человек не реагирует на оклик и прикосновение, дыхания нет. Запрокиньте голову, приподнимите подбородок и до 10 секунд смотрите, слушайте и ощущайте дыхание.","Вызовите скорую по 112 и начинайте реанимацию: положите человека на спину на твёрдую поверхность.","Руки одна на другую, ладони в центре грудной клетки. Надавливайте на 5–6 см с частотой 100–120 в минуту, давая грудной клетке полностью расправляться.","Чередуйте 30 надавливаний и 2 вдоха. При вдохе запрокиньте голову, зажмите нос и выдыхайте в рот так, чтобы грудная клетка приподнялась.","Если не можете делать вдохи — продолжайте только надавливания. Не прекращайте реанимацию до приезда скорой или появления признаков жизни."],9,["cpr"]],
["Кровотечения","Как остановить кровь",["Артериальное кровотечение: кровь алая, бьёт пульсирующей струёй. Венозное: кровь тёмная, вытекает ровно. Капиллярное: кровь сочится по всей поверхности раны.","При сильном кровотечении сначала плотно прижмите рану пальцами, ладонью или тканью и вызовите скорую.","Затем наложите давящую повязку: плотный комок материи на рану и тугое бинтование.","При сильном артериальном кровотечении из конечности накладывают жгут выше раны, поверх одежды или ткани. Запишите время наложения и положите записку под жгут.","Жгут не накладывают на шею. Оставьте жгут на виду и сообщите медикам время его наложения."],9,["tourn"]],
["Ожоги и переломы","Тепло, химия, кости",["Термический ожог: охладите место прохладной проточной водой и накройте чистой сухой салфеткой. Не прокалывайте пузыри, не смазывайте жиром и маслом, не срывайте прилипшую одежду.","Химический ожог: промойте кожу большим количеством проточной воды, снимите пропитанную одежду.","При подозрении на перелом обеспечьте неподвижность повреждённой конечности подручными средствами. Не пытайтесь вправлять кости.","При открытом переломе сначала остановите кровотечение и закройте рану чистой повязкой, затем обездвижьте конечность.","Не извлекайте предметы, застрявшие в ране: их фиксируют и ждут медиков."],9],
["Особые случаи","Позвоночник, шлем, подавился",["При подозрении на травму позвоночника (сильная боль в шее или спине, онемение) без необходимости не перемещайте пострадавшего, зафиксируйте голову и шею.","Шлем с мотоциклиста без необходимости не снимают. Снимать нужно, только если иначе нельзя обеспечить дыхание, и делать это вдвоём, фиксируя голову и шею.","Если пострадавший без сознания, но дышит, и нет опасности для позвоночника, уложите его на бок в устойчивое положение и следите за дыханием.","Если человек подавился и не может дышать, кашлять и говорить: наклоните его вперёд и нанесите до пяти ударов основанием ладони между лопаток. Если не помогло — до пяти толчков в верхнюю часть живота (приём Геймлиха).","Согревайте пострадавшего одеялом, разговаривайте с ним, не давайте пить и есть."],9],
["Основные понятия и термины","Словарь ПДД простым языком",["Дорога — полоса земли, предназначенная для движения транспорта. Она включает проезжую часть, тротуары, обочины и разделительные полосы.","Проезжая часть — элемент дороги для движения безрельсовых транспортных средств. Полоса движения — любая продольная полоса проезжей части, обозначенная разметкой или нет, шириной, достаточной для движения машин в один ряд.","Перекрёсток — место пересечения, примыкания или разветвления дорог на одном уровне. Выезд с прилегающей территории (двор, АЗС, парковка) перекрёстком не считается.","Обгон — опережение с выездом на полосу встречного движения. Опережение — движение с большей скоростью без выезда на встречную полосу.","Остановка — прекращение движения до 5 минут (или на любое время для посадки, высадки, погрузки). Стоянка — прекращение движения более чем на 5 минут не ради посадки, высадки или погрузки.","Недостаточная видимость — видимость дороги менее 300 м в тумане, дождь, снегопад, а также сумерки. ДТП — событие на дороге с участием транспорта, в котором пострадали люди или имущество."],0],
["Предупреждающие знаки","Треугольник с красной каймой",["Предупреждающие знаки сообщают о приближении к опасному участку. Это белый треугольник с красной каймой и чёрным рисунком.","Вне населённых пунктов их ставят за 150–300 м до опасного места, в населённых пунктах — за 50–100 м. Если знак стоит ближе или дальше, расстояние указывает табличка 8.1.1.","Переезды (1.1, 1.2): снизьте скорость и будьте готовы остановиться. Перекрёстки (1.6, 1.7): определите приоритет заранее. Светофор (1.8): приготовьтесь к остановке.","Дорожные условия: опасные повороты (1.11), крутые спуски и подъёмы (1.13, 1.14), скользкая дорога (1.15), неровности (1.16, 1.17), сужение (1.20). Снижайте скорость до безопасной.","Люди и работы: пешеходный переход (1.22), дети (1.23), дорожные работы (1.25). Здесь возможно внезапное появление людей, будьте готовы остановиться.","Знак 1.33 «Прочие опасности» предупреждает об опасностях, для которых отдельного знака нет."],6,["w_bar","w_light","w_ped","w_kids","w_works","warn"]],
["Знаки приоритета","Кто едет первым",["Знаки приоритета определяют очерёдность проезда перекрёстков и узких участков. Это ромб, перевёрнутый треугольник и восьмиугольник.","2.1 «Главная дорога» даёт преимущество на перекрёстках до знака 2.2 «Конец главной дороги». Табличка 8.13 показывает, куда поворачивает главная дорога.","2.4 «Уступите дорогу» обязывает пропустить транспорт на пересекаемой дороге. 2.5 «Движение без остановки запрещено» (STOP) требует обязательной остановки перед стоп-линией или краем пересекаемой проезжей части.","Выезжая со второстепенной дороги, смотрите не только на знак: убедитесь, что не мешаете тем, кто едет по главной.","Если знаков нет и дороги равнозначны, действует правило «помеха справа». Трамвай на равнозначном перекрёстке имеет преимущество независимо от направления."],4,["main","endmain","yield","stop"]],
["Запрещающие знаки","Красный круг и его исключения",["Запрещающие знаки вводят или отменяют ограничения. Обычно это белый круг с красной каймой и чёрным рисунком.","Запреты движения: 3.1 «Въезд запрещён», 3.2 «Движение запрещено», 3.4 «Движение грузовых автомобилей запрещено» (для массы более 3,5 т), 3.7 «Движение с прицепом запрещено», 3.9 «Движение на велосипедах запрещено», 3.10 «Движение пешеходов запрещено».","Размеры и масса: 3.11 (масса), 3.13 (высота), 3.14 (ширина). Учитываются фактическая масса и габариты вместе с грузом.","Манёвры: 3.18.1 и 3.18.2 запрещают поворот направо и налево, 3.19 — разворот, 3.20 — обгон (кроме тихоходных ТС, гужевых повозок, мопедов и двухколёсных мотоциклов без коляски), 3.24 — скорость выше указанной.","Остановка и стоянка: 3.27 запрещает и остановку, и стоянку, 3.28 — только стоянку. 3.29 и 3.30 запрещают стоянку по нечётным и чётным числам месяца.","Зона действия знака — от места установки до ближайшего перекрёстка. Её уточняют таблички 8.2.1–8.2.6, а запрет отменяют знаки 3.21, 3.25 и 3.31. Знаки 3.2–3.8 не распространяются на маршрутные транспортные средства."],6,["noentry","noveh","nobike","m55","nopass","sp40","nostop","odd"]],
["Предписывающие знаки","Синий круг: ехать нужно так",["Предписывающие знаки — синий круг с белым рисунком. Они разрешают движение только так, как показано.","4.1.1–4.1.6 задают направления движения на перекрёстке: прямо, направо, налево и их сочетания. Другие манёвры в этом месте запрещены.","4.2.1–4.2.3 показывают, с какой стороны объезжать препятствие. 4.3 «Круговое движение» означает движение по кругу в указанном стрелками направлении (против часовой стрелки).","4.4.1 и 4.5.1 — велосипедная и пешеходная дорожки: остальным ТС въезд запрещён. 4.6 «Минимальная скорость» разрешает движение только со скоростью не ниже указанной.","Зона действия знаков — от знака до ближайшего перекрёстка, если нет других указаний."],6,["fwd","fr","rl","obr","circ","bikep","min30"]],
["Информационные знаки","Автомагистраль, жилая зона, населённые пункты",["Информационные знаки сообщают о режимах движения и объектах. Они в основном синие, а знак автомагистрали зелёный.","5.1 «Автомагистраль»: действуют особые правила. Запрещены движение пешеходов, велосипедов, мопедов, тракторов и ТС медленнее 40 км/ч, остановка вне специальных площадок, разворот, задний ход и учебная езда. Знак 5.2 отменяет эти правила.","5.21 «Жилая зона»: скорость не более 20 км/ч, пешеходы имеют преимущество и могут идти по проезжей части, запрещены сквозное движение, учебная езда и стоянка с работающим двигателем. При выезде (5.22) уступите дорогу другим.","5.23.1 и 5.24.1 (белый фон) — начало и конец населённого пункта, там действуют правила для населённых пунктов. 5.25 и 5.26 (синий фон) — населённый пункт, где эти правила не действуют.","5.5 «Дорога с односторонним движением», 5.19.1 «Пешеходный переход», 5.16 «Место остановки автобуса», 6.4 «Парковка» помогают ориентироваться."],6,["hwy","res","city","city2","oneway","busstop"]],
["Знаки сервиса и таблички","Дополнительная информация",["Знаки сервиса (7.x) показывают, где можно получить помощь и услуги: пункт первой медицинской помощи (7.1), АЗС (7.3), питание, ремонт, гостиницы.","Таблички (8.x) уточняют действие знаков. Их ставят под знаком, и сами по себе они не действуют.","8.1.1 «Расстояние до объекта» показывает, через сколько метров находится опасный участок или объект.","8.2.1 «Зона действия» указывает длину участка, где действует знак. 8.5.4 «Время действия» — часы, когда знак действует. 8.9 «Ограничение продолжительности стоянки» — максимальное время пребывания.","8.4.1 «Вид ТС» означает, что знак действует только на грузовые автомобили. 8.8 «Платные услуги» — услуги оказываются за плату."],6,["aidp","fuel","p_dist","p_zone","p_time","p_park"]],
["Разметка: линии и цвета","Белая, жёлтая, оранжевая",["Разметка бывает горизонтальной (линии на проезжей части) и вертикальной (полосы на ограждениях и опорах). Постоянная белая, временная оранжевая, жёлтая обозначает запреты остановки и стоянки.","1.1 — сплошная линия: разделяет встречные потоки и обозначает границы полос в опасных местах, пересекать нельзя. 1.3 — двойная сплошная. 1.5 — прерывистая: пересекать можно, если это безопасно.","1.11 — сочетание сплошной и прерывистой линий: пересекать можно только с прерывистой стороны. 1.6 — линия приближения: впереди сплошная линия.","1.4 — жёлтая сплошная линия у бордюра: остановка запрещена. 1.10 — жёлтая прерывистая: стоянка запрещена. 1.17 — жёлтая зигзагообразная линия: остановка маршрутных ТС.","1.12 — стоп-линия, 1.13 — линия «Уступите дорогу», 1.14.1 — «зебра», 1.18 — стрелки направлений по полосам, 1.2.1 — край проезжей части.","Если разметка противоречит знаку, подчиняйтесь знаку."],6,["line","half","ycurb","stopline","yieldl","arrows"]],
["Светофоры и жесты регулировщика","Сигналы шаг за шагом",["Красный запрещает движение. Красный вместе с жёлтым тоже запрещает движение и предупреждает о скором зелёном. Жёлтый запрещает движение, кроме случая, когда нельзя остановиться без экстренного торможения.","Зелёный разрешает движение. Мигающий зелёный сообщает, что скоро включится запрещающий сигнал. Мигающий жёлтый — нерегулируемый перекрёсток, очерёдность определяют знаки.","Стрелка в основной секции разрешает движение только в указанных направлениях. Зелёная стрелка в дополнительной секции при красном: можно ехать в её направлении, уступив дорогу другим.","Реверсивный светофор: красный крест запрещает движение по полосе, зелёная стрелка вниз разрешает.","Регулировщик: рука вверх — движение запрещено всем. Руки в стороны или опущены: с боков можно прямо и направо, спереди и сзади нельзя.","Сигналы регулировщика важнее светофора и знаков приоритета."],4,["w_light"]],
["Дистанция, интервал и тормозной путь","Цифры, которые стоит запомнить",["Пока водитель реагирует на опасность (около 1 секунды), автомобиль проезжает: при 60 км/ч около 17 м, при 90 км/ч около 25 м, при 110 км/ч около 31 м.","Затем идёт торможение. Ориентировочно с 60 км/ч на сухом асфальте нужно ещё около 20 м, на мокром — около 35 м, на снегу — около 70 м, на льду — до 140 м.","Тормозной путь пропорционален квадрату скорости: скорость выросла вдвое — путь вырос примерно вчетверо.","Дистанция: правило двух секунд в хорошую погоду, 4 секунды и больше в дождь и на снегу. Для автопоезда и грузовиков дистанцию увеличивают ещё сильнее.","Боковой интервал выбирайте с запасом: на скользкой дороге и при сильном ветре он должен быть больше."],1,["gap"]],
["Встречный разъезд и узкие участки","Кто уступает",["Если дорога узкая и разъехаться трудно, уступает тот, на чьей полосе есть препятствие.","На подъёме или спуске, где разъехаться нельзя, уступает водитель, движущийся на спуск.","Если препятствие на вашей полосе, остановитесь заранее и пропустите встречных; не начинайте объезд, пока не убедитесь, что успеете завершить манёвр.","Знаки 2.6 и 2.7 показывают, кому принадлежит преимущество на узком участке."],3],
["Расположение на дороге и перестроение","Полосы, обочина, трамвайные пути",["На многополосной дороге выбирайте полосу с учётом скорости и манёвра; тихоходный транспорт держится правее.","Перед перестроением включите указатель поворота и убедитесь, что не создаёте помех попутным и встречным машинам. При одновременном перестроении уступает водитель слева.","Движение по обочине, как правило, запрещено, кроме остановки и особых случаев. Движение по тротуару, как правило, тоже запрещено.","Трамвайные пути попутного направления, расположенные слева на одном уровне с проезжей частью, можно использовать, если это не мешает трамваю и не запрещено знаками и разметкой.","Задний ход: убедитесь в безопасности, при необходимости воспользуйтесь помощью другого лица. Он запрещён на перекрёстках, в тоннелях, на мостах и ж/д переездах."],3],
["Пешеходы и остановки транспорта","Права пешеходов",["На нерегулируемом переходе уступайте пешеходам, вступившим на проезжую часть или идущим к ней; не объезжайте автомобиль, остановившийся перед переходом.","На регулируемом переходе пешеход вправе завершить переход. Поворачивая на зелёный, уступайте пешеходам, идущим через дорогу, на которую вы поворачиваете.","В жилой зоне, на пешеходных зонах и прилегающих территориях пешеходы имеют преимущество.","Слепым пешеходам с белой тростью уступайте при любых условиях. Увидев детей у дороги, снижайте скорость и будьте готовы остановиться.","У остановки трамвая или автобуса пассажиры могут выходить на проезжую часть: снижайте скорость и будьте готовы остановиться."],7,["pedx","w_ped","w_kids"]],
["Железнодорожные переезды","Сигналы, остановка, запреты",["Красный мигающий сигнал, звонок и закрывающийся или закрытый шлагбаум запрещают движение через переезд.","Останавливаться нужно перед стоп-линией или знаком 1.12, а если их нет — не ближе 5 м до шлагбаума, а при отсутствии шлагбаума — не ближе 10 м до ближайшего рельса.","Запрещено объезжать стоящие перед переездом машины по встречной полосе, обгонять на переезде и ближе 100 м перед ним, въезжать на переезд при заторе за ним.","Если двигатель заглох на переезде: высадите людей, уберите машину с путей, при угрозе столкновения подайте сигнал машинисту и вызовите помощь.","Переезды обозначены знаками 1.1 (со шлагбаумом) и 1.2 (без шлагбаума); на переезде без шлагбаума особенно внимательно проверьте, нет ли поезда."],7,["w_bar","w_train"]],
["Движение в сложных условиях","Ночь, туман, дождь, гололёд",["Ночью и в тумане включайте ближний свет, при очень плохой видимости — противотуманные фары. Дальний свет в тумане и дожде слепит самого водителя.","В дождь и по снегу увеличивайте дистанцию вдвое и больше, тормозите плавно. Следите за шинами: летняя резина при морозе теряет сцепление.","На гололёде избегайте резких манёвров, тормозите прерывисто или двигателем. Если начался занос, не давите на тормоз резко, плавно выровняйте руль.","Аквапланирование: на скорости в глубоких лужах колёса теряют сцепление; отпустите педаль газа, не тормозите резко, держите руль ровно.","Недостаточная видимость — менее 300 м. В таких условиях скорость должна позволять остановиться в пределах видимости."],5]
];

 const top=sc[0]?sc[0][1]:0;return sc.filter(y=>y[1]>=Math.max(2,top*.6)).slice(0,5).map(y=>y[0])}
function findT(x){const w=[...new Set(stems(x))];if(!w.length)return[];
 return TH.map((t,k)=>{const a=new Set(stems(t[0]+" "+t[1])),b=new Set(stems(t[2].join(" ")));let s=0;w.forEach(z=>{if(a.has(z))s+=4;if(b.has(z))s+=1});return[k,s]}).filter(y=>y[1]>=3).sort((p,q)=>q[1]-p[1]).slice(0,2).map(y=>y[0])}
function advice(){
 const rows=TP.map((n,k)=>{const ids=all.filter(i=>Q[i][0]===k),[c,w]=acc(ids),seen=ids.filter(i=>tot(i)).length;return{k,n,c,w,seen,cnt:ids.length,acc:c+w?c/(c+w):null}});
 const total=rows.reduce((s,r)=>s+r.c+r.w,0);
 if(!total)return{t:"Вы ещё не решали тесты, поэтому рекомендовать пока нечего. Начните с первой темы: <b>"+TP[0]+"</b>.",a:[["Теория: "+TP[0],()=>openTh(0)],["Тест по теме",()=>topicTest(0)]]};
 const weak=rows.filter(r=>r.c+r.w>=3&&r.acc<.8).sort((x,y)=>x.acc-y.acc),fresh=rows.filter(r=>r.seen<r.cnt*.5).sort((x,y)=>x.seen/x.cnt-y.seen/y.cnt);
 const lines=rows.filter(r=>r.acc!==null).sort((x,y)=>x.acc-y.acc).slice(0,3).map(r=>`• ${r.n}: ${Math.round(r.acc*100)}% (ошибок ${r.w})`);
 let t="<b>Ваши результаты:</b> решено заданий: "+total+".<br>Самые слабые темы:<br>"+lines.join("<br>")+"<br><br>",a=[];
 if(weak.length){const r=weak[0];t+=`<b>Рекомендую разобрать: ${r.n}.</b> Сначала прочитайте теорию, потом пройдите тест по теме.`+(weak[1]?`<br>Следом: ${weak[1].n}.`:"");a.push(["Теория: "+r.n,()=>openTh(r.k)],["Тест: "+r.n,()=>topicTest(r.k)])}
 else if(fresh.length){const r=fresh[0];t+=`Слабых тем нет. Рекомендую открыть новую тему: <b>${r.n}</b> (изучено ${r.seen} из ${r.cnt} вопросов).`;a.push(["Теория: "+r.n,()=>openTh(r.k)],["Тест: "+r.n,()=>topicTest(r.k)])}
 else{t+="Все темы идут уверенно (80% и выше). Переходите к сложным вопросам.";a.push(["Сложные вопросы",hard])}
 if(st.wrong.length){t+=`<br>В «Работе над ошибками» ждут повтора вопросов: ${st.wrong.length}.`;a.push(["Работа над ошибками",mist])}
 return{t,a}}
function findS(x){const w=[...new Set(stems(x))];if(!w.length)return[];const out=[];
 SG.forEach((g,gi)=>g[1].forEach(s=>{const a=new Set(stems(s[0]+" "+s[1])),b=new Set(stems(s[3]));let c=0;w.forEach(z=>{if(a.has(z))c+=3;if(b.has(z))c+=1});if(c>=3)out.push([gi,s,c])}));
 return out.sort((p,q)=>q[2]-p[2]).slice(0,3)}
function search(x){const qs=findQ(x),ts=findT(x),ss=findS(x);
 if(!qs.length&&!ts.length&&!ss.length)return{t:"Ничего похожего не нашёл. Попробуйте другие слова, например «жгут», «прицеп», «обгон на мосту», или напишите номер: «вопрос 57».",a:[]};
 let t="",a=[];
 if(qs.length){t+="<b>Нашёл вопросы:</b><br>"+qs.map(qline).join("<br>");qs.slice(0,3).forEach(i=>a.push(["Открыть вопрос №"+(i+1),()=>openQ(i)]));
  const c={};qs.forEach(i=>c[Q[i][0]]=(c[Q[i][0]]||0)+1);const top=Object.keys(c).sort((p,q)=>c[q]-c[p])[0];if(c[top]>=2)a.push(["Весь тест по теме «"+TP[top]+"»",()=>topicTest(+top)])}
 if(ts.length){t+=(t?"<br><br>":"")+"<b>В теории:</b><br>"+ts.map(k=>"• "+TH[k][0]).join("<br>");ts.forEach(k=>a.push(["Читать: "+cut(TH[k][0],26),()=>{BK=chat;chap(k)}]))}
 if(ss.length){t=(t?t+"<br><br>":"")+"<b>В галерее знаков:</b><br>"+ss.map(y=>`• ${y[1][0]} «${y[1][1]}»: ${y[1][3]}`).join("<br>");ss.slice(0,2).forEach(y=>a.push(["Показать знак "+y[1][0],()=>signs(y[0])]))}
 return{t,a}}
const HELP_T="Умею три дела:<br>• <b>найти вопрос</b>: напишите тему («жгут», «прицеп») или номер («вопрос 57»), я скажу, в какой он теме и где лежит;<br>• <b>посоветовать тему</b>: спросите «что учить дальше?», и я посмотрю ваши результаты.<br>• <b>объяснить знак</b>: напишите «знак 3.20» или название знака.<br>Я не нейросеть: знаю только базу вопросов, теорию и ваши результаты.";
function brain(x){const low=x.toLowerCase().replace(/ё/g,"е");
 const m=low.match(/(?:№|вопрос\s*|номер\s*)(\d{1,3})(?!\d)/)||low.match(/^\s*(\d{1,3})\s*$/);
 if(m){const n=+m[1],i=n-1;return n>=1&&n<=Q.length?{t:`Вопрос №${n} лежит в теме <b>${TP[Q[i][0]]}</b>, это вопрос ${qpos(i)} в теме${Q[i][7]?", он отмечен как сложный":""}.<br>«${cut(Q[i][1],140)}»`,a:[["Открыть вопрос",()=>openQ(i)],["Тест по теме",()=>topicTest(Q[i][0])]]}:{t:"В базе вопросы с №1 по №"+Q.length+".",a:[]}}
 if(/^(привет|здравствуй|добрый|hello|hi)/.test(low))return{t:"Здравствуйте! "+HELP_T,a:[]};
 if(/что (ты )?(умеешь|можешь)|^помощь$|^help$|^\?$/.test(low))return{t:HELP_T,a:[]};
 if(/дальше|далее|следующ|посоветуй|рекоменд|слаб|статист|результат|прогресс|что (мне )?(учить|повтор|разобрат|изуч)|с чего начат/.test(low))return advice();
 if(/сложн/.test(low)&&!/(где|найди|про )/.test(low)){const n=all.filter(i=>Q[i][7]).length;return{t:`Сложных вопросов в базе: ${n}. Они собраны во вкладке «Сложные»: там есть тест, экзамен и разбор по темам.`,a:[["Открыть «Сложные»",hard]]}}
const sm=low.match(/(?:^|\s)(\d{1,2}\.\d{1,2}(?:\.\d{1,2})?)(?!\d)/);
 if(sm&&/(знак|разметк|лини|табличк)/.test(low)){let f=null;SG.forEach((g,gi)=>g[1].forEach(z=>{if(z[0]===sm[1]&&(!f||(g[0]==="Разметка")===/(разметк|лини)/.test(low)))f=[gi,z]}));
  return f?{t:`<b>${f[1][0]} «${f[1][1]}»</b><br>${f[1][3]}`,a:[["Показать в галерее",()=>signs(f[0])],["Тест по группе «"+SG[f[0]][0]+"»",()=>start("Знаки: "+SG[f[0]][0],()=>sh(SQ.filter(q=>q[1]===f[0]).map(q=>q[0])).slice(0,15))]]}:{t:"Такого номера нет в галерее. Попробуйте название знака.",a:[]}}
 return search(x)}

 app.innerHTML=`<div class="top"><button class="back" id="bk">‹ Назад</button><span>Помощник</span></div><div class="chips">`+["Что учить дальше?","Где вопрос про жгут?","Где вопрос про прицеп?","Мои слабые темы"].map((c,i)=>`<button class="chip" data-c="${i}">${c}</button>`).join("")+`</div>`+
 CH.map((m,i)=>`<div class="bub ${m.me?"me":"bot"}">${m.t}${(m.a||[]).map((x,j)=>`<button class="ab" data-m="${i}" data-a="${j}">${x[0]}</button>`).join("")}</div>`).join("")+

function topics(){nav("tests");
 app.innerHTML=`<div class="top"><button class="back" id="bk">‹ Меню</button></div><h1>Темы</h1>`+TP.map((t,k)=>{const ids=all.filter(i=>Q[i][0]===k),[c,w]=acc(ids);
 return`<button class="m" data-k="${k}"><b>${t}</b><span>${ids.length} вопр.${c+w?" · точность "+Math.round(c/(c+w)*100)+"%":""}</span></button>`}).join("");
 $("#bk").onclick=home;
 app.querySelectorAll(".m").forEach(b=>b.onclick=()=>{const k=+b.dataset.k;start(TP[k],()=>sh(all.filter(i=>Q[i][0]===k)),0,null,k)});
}
function start(title,gen,exam,tk,tp){stop();window.scrollTo(0,0);const ids=gen();R={title,gen,ids,exam,tk,tp,i:0,log:[],pick:null,o:null,hid:[],end:Date.now()+12e5};
 if(exam)R.tm=setInterval(tick,1000);show()}
function tick(){const s=Math.max(0,Math.round((R.end-Date.now())/1000)),e=$("#tm");if(e)e.textContent=Math.floor(s/60)+":"+String(s%60).padStart(2,"0");if(!s)finish(1)}
const T_=q=>q[5]||"one";
const right=q=>{const t=T_(q);return t==="multi"?q[2].slice(0,q[6]).join("; "):t==="order"?q[2].join(" → "):q[2][0]};
function judge(q,v){const t=T_(q);
 if(t==="multi")return v.length===q[6]&&v.every(x=>q[2].indexOf(x)<q[6]);
 if(t==="order")return v.join("|")===q[2].join("|");
 if(t==="num")return q[2].some(x=>x.replace(",",".")===String(v).trim().replace(",","."));
 return v===q[2][0]}
function answer(v){const id=R.ids[R.i],q=Q[id],t=T_(q),ok=judge(q,v),txt=Array.isArray(v)?v.join(t==="order"?" → ":"; "):v;
 R.log.push({id,ok,pick:txt});rec(id,ok);buzz(ok?"success":"error");R.pick=txt;R.ok=ok;R.done=1;R.exam?next():show()}
function show(){nav(null);const id=R.ids[R.i],q=Q[id],t=T_(q),d=!!R.done;
 R.o=R.o||(t==="tf"?["Верно","Неверно"]:sh(q[2]));R.hid=R.hid||[];R.sel=R.sel||[];R.seq=R.seq||[];
 const H={one:"Выберите один ответ",tf:"Верно или неверно?",multi:"Выберите все верные ответы",order:"Нажимайте шаги по порядку",num:"Введите число"}[t],im=pic(q[4]||PIC[id]);
 let b="";
 if(t==="one"||t==="tf")b=R.o.map((x,j)=>R.hid.includes(x)?"":`<button class="o ${d?(x===q[2][0]?"ok":x===R.pick?"bad":""):""}" data-j="${j}" ${d?"disabled":""}><i>${t==="tf"?(j?"✗":"✓"):"АБВГ"[j]}</i><span>${x}</span></button>`).join("");
 else if(t==="multi")b=R.o.map((x,j)=>{const r=q[2].indexOf(x)<q[6],on=R.sel.includes(x);return`<button class="o ${d?(r?"ok":on?"bad":""):(on?"sel":"")}" data-j="${j}" ${d?"disabled":""}><i>${on||(d&&r)?"✓":""}</i><span>${x}</span></button>`}).join("")+(d?"":`<button class="btn" id="ck" ${R.sel.length?"":"disabled"}>Проверить</button>`);
 else if(t==="order"){const left=R.o.map((x,j)=>[x,j]).filter(a=>!R.seq.includes(a[0]));
  b=d?q[2].map((x,j)=>`<div class="o ok"><i>${j+1}</i><span>${x}</span></div>`).join(""):R.seq.map((x,j)=>`<div class="o sel"><i>${j+1}</i><span>${x}</span></div>`).join("")+left.map(a=>`<button class="o" data-x="${a[1]}"><i>+</i><span>${a[0]}</span></button>`).join("")+(R.seq.length?'<button class="btn alt" id="rs">Сбросить</button>':"")+(left.length?"":'<button class="btn" id="ck">Проверить</button>')}
 else b=d?`<div class="o ${R.ok?"ok":"bad"}"><i>${R.ok?"✓":"✗"}</i><span>Ваш ответ: ${R.pick}</span></div>`:'<input class="num" id="nm" inputmode="decimal" autocomplete="off" placeholder="Введите число"><button class="btn" id="ck">Ответить</button>';
 app.innerHTML=`<div class="top"><button class="back" id="bk">‹ Меню</button><span>${R.exam?'<b id="tm"></b> · ':""}${R.i+1} из ${R.ids.length}</span></div><div class="bar"><i style="width:${R.i/R.ids.length*100}%"></i></div><span class="tp">${TP[q[0]]}</span>${q[7]?' <span class="tp hardp">Сложный</span>':""}<p class="q">${q[1]}</p>`+(im?`<div class="im">${im}</div>`:"")+`<p class="hint">${H}</p>`+b+
 (d?`<div class="ex"><b>${R.ok?"Верно.":"Неверно."}</b> ${t==="one"||t==="tf"?"":"Правильный ответ: "+right(q)+". "}${q[3]}</div><button class="btn" id="nx">${R.i+1<R.ids.length?"Дальше":"Результат"}</button>`:(t==="one"&&!R.exam&&!R.hid.length?'<button class="btn alt" id="ht">Подсказка 50/50</button>':""));
 $("#bk").onclick=home;if(R.exam)tick();
 app.querySelectorAll(".o[data-j]").forEach(e=>e.onclick=()=>{const x=R.o[+e.dataset.j];if(t==="multi"){const k=R.sel.indexOf(x);k<0?R.sel.push(x):R.sel.splice(k,1);show()}else answer(x)});
